proxy_cache_path /var/cache/nginx keys_zone=app:10m;
server {
    listen 80;
    server_name example.com;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.0;
        proxy_cache app;
        proxy_ignore_headers Cache-Control Set-Cookie;
        proxy_cache_valid 200 10m;
    }
}
