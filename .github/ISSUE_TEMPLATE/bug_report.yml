name: Bug report
description: A script crashed, reported a wrong finding, or a skill gave unsafe or wrong advice
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste secrets, API keys, `.env` values or proprietary source code.** A minimal,
        redacted component or config that reproduces the problem is ideal.
  - type: dropdown
    id: skill
    attributes:
      label: Skill
      options:
        - nextjs-app-router-patterns
        - nextjs-seo-metadata
        - server-actions-security
        - react-performance-review
        - nextjs-env-config
        - react-accessibility-review
        - react-testing
        - nextjs-deploy-selfhost
        - validator / repository tooling
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: The command you ran, its output, and (for false positives/negatives) a minimal input file.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "Next.js 16.0, React 19.2, Python 3.12, macOS 15, Claude Code / Codex CLI"
    validations:
      required: true
